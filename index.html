<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEBI Mutual Fund Complaint Analytics Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f5f7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 16px 24px;
      text-align: center;
    }
    header h1 {
      font-size: 1.3rem;
      font-weight: 600;
    }
    header p {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
    }
    .dashboard-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .dashboard-frame-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      border-radius: 8px;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    footer {
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>SEBI Mutual Fund Complaint Analytics Dashboard</h1>
    <p>End-to-end pipeline: AMFI scraping → PostgreSQL (Supabase) → Power BI</p>
  </header>

  <div class="dashboard-container">
    <div class="dashboard-frame-wrapper">
      <iframe
        title="sebi_dashboard"
        src="https://app.powerbi.com/view?r=eyJrIjoiYzY0NDE4OTAtYjE1OC00NGMzLTg4MTYtMWU5Y2U3OTE2MTBiIiwidCI6ImQxZjE0MzQ4LWYxYjUtNGEwOS1hYzk5LTdlYmYyMTNjYmM4MSIsImMiOjEwfQ%3D%3D"
        allowFullScreen="true">
      </iframe>
    </div>
  </div>

  <footer>
    Built by Sanaz &middot; Data source: AMFI / SEBI public complaint disclosures
  </footer>
</body>
</html>
